!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener - NETHUWH TOOL WEB</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
    <h1>URL Shortener</h1>
    <a href="../index.html">← Back</a>
</header>
<main>
    <input type="text" id="longUrl" placeholder="Enter URL here">
    <button onclick="shortenURL()">Shorten</button>
    <p id="shortUrl"></p>
</main>

<script>
function shortenURL() {
    const longUrl = document.getElementById('longUrl').value.trim();
    if(!longUrl) return alert('Enter a URL!');
    const code = Math.random().toString(36).substring(2,8);
    const short = `${window.location.origin}/?${code}`;
    document.getElementById('shortUrl').innerHTML = `Short URL: <a href="${longUrl}" target="_blank">${short}</a>`;
}
</script>
</body>
</html>
