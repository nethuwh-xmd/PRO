<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes - NETHUWH TOOL WEB</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
    <h1>Notes</h1>
    <a href="../index.html">← Back</a>
</header>
<main>
    <textarea id="noteText" placeholder="Write your notes here..." rows="10" cols="30"></textarea><br>
    <button onclick="saveNote()">Save</button>
    <button onclick="loadNote()">Load</button>
</main>

<script>
function saveNote(){
    const text = document.getElementById('noteText').value;
    localStorage.setItem('nethuNotes', text);
    alert('Saved!');
}
function loadNote(){
    const text = localStorage.getItem('nethuNotes') || '';
    document.getElementById('noteText').value = text;
}
</script>
</body>
</html>
