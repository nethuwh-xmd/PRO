<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator - NETHUWH TOOL WEB</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
    <h1>Calculator</h1>
    <a href="../index.html">← Back</a>
</header>
<main>
    <input type="text" id="calcInput" placeholder="0">
    <div class="calc-buttons">
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('+')">+</button><br>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('-')">-</button><br>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('*')">*</button><br>
        <button onclick="press('0')">0</button>
        <button onclick="calculate()">=</button>
        <button onclick="clearInput()">C</button>
        <button onclick="press('/')">/</button>
    </div>
</main>

<script>
function press(val){ document.getElementById('calcInput').value += val; }
function calculate(){ 
    try{
        document.getElementById('calcInput').value = eval(document.getElementById('calcInput').value);
    }catch(e){ alert('Invalid Expression'); }
}
function clearInput(){ document.getElementById('calcInput').value = ''; }
</script>
</body>
</html>
